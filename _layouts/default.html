<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  {% assign og_desc = page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 200 %}
  <meta name="description" content="{{ og_desc | escape }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ og_desc | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
  {% if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  {% endif %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/fontawesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/brands.min.css">
  <link rel="stylesheet" href="{{ '/assets/dist/styles.css' | relative_url }}">
  {% feed_meta %}
</head>
<body class="bg-bg0 text-fg1 font-sans min-h-screen">
  <div class="flow-root my-4">
  {% include header.html %}
  <main class="font-mono max-w-3xl lg:max-w-4xl mx-auto py-8 px-4">
    {{ content }}
  </main>
  {% include footer.html %}
  <script type="module" src="{{ '/assets/dist/main.js' | relative_url }}"></script>
  </div>
</body>
</html>
